    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #04041a;
            --card: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --cyan: #64ffda;
            --gold: #f5c518;
            --purple: #a855f7;
            --pink: #f472b6;
            --white: #f0f4ff;
            --silver: #94a3b8;
            --dim: #475569;
            --font-display: "Cinzel", serif;
            --font-body: "Inter", sans-serif;
            --radius: 16px;
            --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        body {
            background: var(--bg);
            color: var(--white);
            font-family: var(--font-body);
            overflow-x: hidden;
            line-height: 1.6;
            padding-bottom: 80px;
        }

        /* Starfield */
        .stars-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .stars-bg::before,
        .stars-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 20% 30%,
                    rgba(255, 255, 255, 0.5),
                    transparent),
                radial-gradient(1px 1px at 60% 70%,
                    rgba(255, 255, 255, 0.3),
                    transparent),
                radial-gradient(2px 2px at 80% 20%,
                    rgba(255, 255, 255, 0.4),
                    transparent),
                radial-gradient(1px 1px at 40% 80%,
                    rgba(255, 255, 255, 0.25),
                    transparent),
                radial-gradient(1px 1px at 90% 50%,
                    rgba(255, 255, 255, 0.35),
                    transparent);
        }

        /* Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(80px);
            opacity: 0.1;
            animation: orbFloat linear infinite;
        }

        .orb1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #7c3aed, transparent);
            top: -10%;
            left: -10%;
            animation-duration: 35s;
        }

        .orb2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #0f766e, transparent);
            bottom: -5%;
            right: -5%;
            animation-duration: 45s;
            animation-direction: reverse;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            33% {
                transform: translate(30px, -50px) rotate(120deg);
            }

            66% {
                transform: translate(-20px, 30px) rotate(240deg);
            }

            100% {
                transform: translate(0, 0) rotate(360deg);
            }
        }

        /* Layout */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.25rem;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .page-header {
            text-align: center;
            padding: 3rem 0 2rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        .page-header .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--silver);
            font-size: 0.85rem;
            text-decoration: none;
            margin-bottom: 1.5rem;
            transition: color 0.3s;
        }

        .page-header .back-link:hover {
            color: var(--cyan);
        }

        .page-icon {
            font-size: 3rem;
            margin-bottom: 0.75rem;
            filter: drop-shadow(0 0 20px rgba(100, 255, 218, 0.4));
            animation: iconPulse 3s ease-in-out infinite;
        }

        @keyframes iconPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .page-title {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 700;
            background: linear-gradient(135deg,
                    var(--gold),
                    var(--white),
                    var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            color: var(--silver);
            font-size: 1rem;
        }

        /* Date selector */
        .date-strip {
            display: flex;
            align-items: center;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .date-strip label {
            color: var(--silver);
            font-size: 0.9rem;
        }

        .date-input {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--white);
            padding: 0.6rem 1rem;
            font-size: 0.95rem;
            font-family: var(--font-body);
            outline: none;
            cursor: pointer;
            transition: border-color 0.3s;
            color-scheme: dark;
        }

        .date-input:focus {
            border-color: var(--cyan);
        }

        .refresh-btn {
            background: linear-gradient(135deg,
                    rgba(100, 255, 218, 0.1),
                    rgba(100, 255, 218, 0.2));
            border: 1px solid rgba(100, 255, 218, 0.3);
            border-radius: 12px;
            color: var(--cyan);
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: rgba(100, 255, 218, 0.2);
            transform: translateY(-1px);
        }

        /* Auspicious banner */
        .auspicious-banner {
            padding: 1rem 1.5rem;
            border-radius: var(--radius);
            margin-bottom: 2rem;
            border: 1px solid;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 600;
            font-size: 0.95rem;
            animation: fadeIn 0.6s ease;
        }

        .auspicious-banner.good {
            background: rgba(100, 255, 218, 0.07);
            border-color: rgba(100, 255, 218, 0.3);
            color: var(--cyan);
        }

        .auspicious-banner.bad {
            background: rgba(248, 113, 113, 0.07);
            border-color: rgba(248, 113, 113, 0.3);
            color: #f87171;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Grid */
        .panchang-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        /* Cards */
        .panch-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            transition: all var(--transition);
            animation: cardIn 0.5s ease both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .panch-card:hover {
            transform: translateY(-4px);
            border-color: rgba(100, 255, 218, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .panch-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at top left,
                    rgba(100, 255, 218, 0.04),
                    transparent 60%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .panch-card:hover::before {
            opacity: 1;
        }

        .card-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--cyan);
            margin-bottom: 0.5rem;
        }

        .card-value {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--white);
            margin-bottom: 0.3rem;
            line-height: 1.2;
        }

        .card-sub {
            font-size: 0.82rem;
            color: var(--silver);
            line-height: 1.5;
        }

        .card-prog {
            margin-top: 0.75rem;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 100px;
            height: 4px;
            overflow: hidden;
        }

        .card-prog-fill {
            height: 100%;
            border-radius: 100px;
            background: linear-gradient(90deg, var(--cyan), var(--purple));
            transition: width 1s ease;
        }

        /* Special card colors */
        .card-gold .card-label {
            color: var(--gold);
        }

        .card-gold::before {
            background: radial-gradient(ellipse at top left,
                    rgba(245, 197, 24, 0.05),
                    transparent 60%);
        }

        .card-gold:hover {
            border-color: rgba(245, 197, 24, 0.25);
        }

        .card-gold .card-prog-fill {
            background: linear-gradient(90deg, var(--gold), #f97316);
        }

        .card-purple .card-label {
            color: var(--purple);
        }

        .card-purple::before {
            background: radial-gradient(ellipse at top left,
                    rgba(168, 85, 247, 0.05),
                    transparent 60%);
        }

        .card-purple:hover {
            border-color: rgba(168, 85, 247, 0.25);
        }

        .card-purple .card-prog-fill {
            background: linear-gradient(90deg, var(--purple), var(--pink));
        }

        .card-pink .card-label {
            color: var(--pink);
        }

        .card-pink:hover {
            border-color: rgba(244, 114, 182, 0.25);
        }

        /* Wide cards */
        .card-wide {
            grid-column: 1/-1;
        }

        .timing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-top: 0.75rem;
        }

        .timing-item {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .timing-label {
            font-size: 0.72rem;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .timing-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--white);
        }

        .timing-bad {
            color: #f87171;
        }

        /* Sign display */
        .sign-row {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .sign-item {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .sign-item .sign-hi {
            font-family: "Noto Sans Devanagari", sans-serif;
            font-size: 1.1rem;
            color: var(--gold);
        }

        .sign-item .sign-en {
            font-size: 0.8rem;
            color: var(--silver);
        }

        .sign-item .sign-deg {
            font-size: 0.75rem;
            color: var(--dim);
        }

        /* Live clock */
        .live-clock {
            text-align: center;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .live-time {
            font-family: var(--font-display);
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold), var(--white));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.05em;
        }

        .live-date {
            color: var(--silver);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        /* Footer nav */
        .page-nav {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .nav-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 1.1rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 100px;
            color: var(--silver);
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.3s;
        }

        .nav-pill:hover {
            color: var(--white);
            border-color: rgba(100, 255, 218, 0.3);
            background: rgba(100, 255, 218, 0.05);
        }
    </style>

    <div class="container">

            <a href="index.html" class="back-link">← Back to Home</a>

                Vedic Almanac — Tithi ┬╖ Nakshatra ┬╖ Yoga ┬╖ Karana ┬╖ Vara
            </p>
        </div>
        <div class="live-clock">
            <div class="live-time" id="liveTime">--:--:--</div>
            <div class="live-date" id="liveDate">Loading...</div>

            <label for="panchangDate">⚡ Select Date:</label>
            <input type="date" class="date-input" id="panchangDate" />

            <span id="auspiciousText">Calculating...</span>
        </div>
        <div class="panchang-grid" id="panchangGrid">
            <!-- Cards injected by JS -->
        </div>

            <a href="planetary-clock.html" class="nav-pill">🬉 Live Planetary Clock</a>

    <script src="js/panchang-engine.js"></script>
    <script>
const engine = new PanchangEngine();
let currentDate = new Date();

function pad(n) {
    return String(n)
        .padStart(2, "0");
}
/* Live clock */
function updateClock() {
    const now = new Date();
    document.getElementById("liveTime")
        .textContent =
        `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    document.getElementById("liveDate")
        .textContent =
        now.toLocaleDateString("en-IN", {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric",
        });
}
setInterval(updateClock, 1000);
updateClock();

function renderPanchang(date) {
    const tz = -new Date()
        .getTimezoneOffset() / 60;
    /* local tz offset */
    const p = engine.calculate(date, tz);
    /* Auspicious banner */
    const banner = document.getElementById("auspiciousBanner");
    const isGood = p.isAuspicious.value;
    banner.className = `auspicious-banner ${isGood ? "good" : "bad"}`;
    document.getElementById("auspiciousIcon")
        .textContent = isGood ?
        "✨" :
        "☁";
    document.getElementById("auspiciousText")
        .textContent =
        p.isAuspicious.reason;
    /* Build cards */
    const grid = document.getElementById("panchangGrid");
    grid.innerHTML =
        `                 <div class="panch-card card-gold" style="animation-delay:.05s">                     <div class="card-label">� Tithi<\/div>                     <div class="card-value">${p.tithi.name}<\/div>                     <div class="card-sub">${p.paksha} ┬╖ #${p.tithi.number}<\/div>                     <div class="card-prog"><div class="card-prog-fill" style="width:${p.tithi.percent}%"><\/div><\/div>                     <div class="card-sub" style="margin-top:.4rem">${p.tithi.percent}% elapsed<\/div>                 <\/div>                  <div class="panch-card" style="animation-delay:.1s">                     <div class="card-label">⭐ Nakshatra<\/div>                     <div class="card-value">${p.nakshatra.name}<\/div>                     <div class="card-sub">Lord: <strong>${p.nakshatra.lord}<\/strong> ┬╖ #${p.nakshatra.number}<\/div>                     <div class="card-prog"><div class="card-prog-fill" style="width:${p.nakshatra.percent}%"><\/div><\/div>                     <div class="card-sub" style="margin-top:.4rem">${p.nakshatra.percent}% elapsed<\/div>                 <\/div>                  <div class="panch-card card-purple" style="animation-delay:.15s">                     <div class="card-label">⚡ Yoga<\/div>                     <div class="card-value">${p.yoga.name}<\/div>                     <div class="card-sub">Yoga #${p.yoga.number} of 27<\/div>                     <div class="card-prog"><div class="card-prog-fill" style="width:${p.yoga.percent}%"><\/div><\/div>                     <div class="card-sub" style="margin-top:.4rem">${p.yoga.percent}% elapsed<\/div>                 <\/div>                  <div class="panch-card card-pink" style="animation-delay:.2s">                     <div class="card-label">✦ Karana<\/div>                     <div class="card-value">${p.karana}<\/div>                     <div class="card-sub">Half-tithi unit<\/div>                 <\/div>                  <div class="panch-card card-gold" style="animation-delay:.25s">                     <div class="card-label">☀️ Vara (Weekday)<\/div>                     <div class="card-value">${p.vara}<\/div>                     <div class="card-sub">Lord: <strong>${p.varaLord}<\/strong><\/div>                 <\/div>                  <div class="panch-card" style="animation-delay:.3s">                     <div class="card-label">⚡ Moon Sign<\/div>                     <div class="card-value">${p.moonSign.english}<\/div>                     <div class="sign-row">                         <div class="sign-item">                             <span class="sign-hi">${p.moonSign.hindi}<\/span>                             <span class="sign-en">Moon Rashi<\/span>                             <span class="sign-deg">${p.moonSign.degree}┬░ in sign<\/span>                         <\/div>                         <div class="sign-item">                             <span class="sign-hi">${p.sunSign.hindi}<\/span>                             <span class="sign-en">Sun Rashi<\/span>                             <span class="sign-deg">${p.sunSign.degree}┬░ in sign<\/span>                         <\/div>                     <\/div>                 <\/div>                  <div class="panch-card card-wide" style="animation-delay:.35s">                     <div class="card-label">✐ Key Timings<\/div>                     <div class="timing-grid">                         <div class="timing-item">                             <span class="timing-label">� Rahu Kaal<\/span>                             <span class="timing-value timing-bad">${p.rahuKaal}<\/span>                         <\/div>                         <div class="timing-item">                             <span class="timing-label">✨ Abhijit Muhurta<\/span>                             <span class="timing-value">${p.abhijit}<\/span>                         <\/div>                         <div class="timing-item">                             <span class="timing-label">�🌙 Moon Longitude<\/span>                             <span class="timing-value">${parseFloat(p.moonLon).toFixed(2)}┬░<\/span>                         <\/div>                         <div class="timing-item">                             <span class="timing-label">☀️ Sun Longitude<\/span>                             <span class="timing-value">${parseFloat(p.sunLon).toFixed(2)}┬░<\/span>                         <\/div>                         <div class="timing-item">                             <span class="timing-label">🌒 Elongation<\/span>                             <span class="timing-value">${p.elongation}┬░<\/span>                         <\/div>                     <\/div>                 <\/div>             `;
}
/* Date input */
const dateInput = document.getElementById("panchangDate");
const today = new Date();
dateInput.value = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
dateInput.addEventListener("change", () => {
    const [y, m, d] = dateInput.value.split("-")
        .map(Number);
    currentDate = new Date(
        y,
        m - 1,
        d,
        today.getHours(),
        today.getMinutes(),
    );
    renderPanchang(currentDate);
});
document.getElementById("todayBtn")
    .addEventListener("click", () => {
        currentDate = new Date();
        dateInput.value = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
        renderPanchang(currentDate);
    });
/* Initial render */
renderPanchang(today);
/* Auto refresh every 5 minutes */
setInterval(
    () => {
        if (
            dateInput.value ===
            `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`
        ) {
            renderPanchang(new Date());
        }
    },
    5 * 60 * 1000,
);
</script>
