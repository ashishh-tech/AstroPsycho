<!doctype html>
<html lang="en">
  <head>
    <meta
      name="description"
      content="AstroPsycho Rashifal — Daily, Monthly and Yearly horoscope for Health, Education, Wealth, Career and Family based on your Vedic birth chart."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover"
    />
    <title>Rashifal — AstroPsycho</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="mobile-nav.css" />
    <meta name="theme-color" content="#0a0a1f" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      .rashi-hero {
        text-align: center;
        padding: 3rem 1rem 1.5rem;
        background: radial-gradient(
          ellipse at top,
          rgba(167, 139, 250, 0.1),
          transparent 70%
        );
      }

      .rashi-hero h1 {
        font-family: "Cinzel", serif;
        font-size: 2.4rem;
        letter-spacing: 0.04em;
        margin-bottom: 0.3rem;
      }

      .rashi-hero .hin {
        font-family: "Noto Sans Devanagari", sans-serif;
        font-size: 1.1rem;
        color: var(--moon-silver);
        margin-bottom: 0.3rem;
      }

      .rashi-hero p {
        color: var(--moon-silver);
        max-width: 650px;
        margin: 0 auto;
        line-height: 1.8;
        font-size: 0.93rem;
      }

      /* Tabs */
      .tab-bar {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        margin: 1.5rem auto;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 0.4rem;
        max-width: 380px;
      }

      .tab-btn {
        flex: 1;
        padding: 0.65rem 1rem;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        background: transparent;
        color: var(--moon-silver);
        transition: all 0.3s ease;
      }

      .tab-btn.active {
        background: linear-gradient(135deg, #a78bfa, #7c3aed);
        color: #fff;
        box-shadow: 0 4px 15px rgba(124, 58, 237, 0.35);
      }

      .tab-btn:hover:not(.active) {
        color: #fff;
        background: rgba(167, 139, 250, 0.12);
      }

      /* Period label */
      .period-label {
        text-align: center;
        font-family: "Noto Sans Devanagari", sans-serif;
        color: var(--accent-cyan);
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
        opacity: 0.85;
      }

      /* Aspect grid */
      .aspect-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.25rem;
        max-width: 900px;
        margin: 0 auto 4rem;
      }

      @media (min-width: 700px) {
        .aspect-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (min-width: 1050px) {
        .aspect-grid {
          grid-template-columns: 1fr 1fr 1fr;
        }
      }

      /* Card */
      .aspect-card {
        background: rgba(18, 18, 48, 0.7);
        border: 1px solid rgba(167, 139, 250, 0.2);
        border-radius: 16px;
        overflow: hidden;
        transition:
          transform 0.25s,
          box-shadow 0.25s;
      }

      .aspect-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 30px rgba(124, 58, 237, 0.18);
      }

      .ac-header {
        padding: 1rem 1.25rem 0.75rem;
        display: flex;
        align-items: center;
        gap: 0.7rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      }

      .ac-emoji {
        font-size: 1.8rem;
      }

      .ac-title {
        font-family: "Cinzel", serif;
        font-size: 1rem;
        color: #e2e8f0;
        letter-spacing: 0.03em;
      }

      .ac-body {
        padding: 1.1rem 1.25rem 1.25rem;
      }

      /* Score bar */
      .score-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.85rem;
      }

      .score-num {
        font-size: 1.9rem;
        font-weight: 800;
        min-width: 50px;
        line-height: 1;
      }

      .score-bar-wrap {
        flex: 1;
      }

      .score-bar-bg {
        height: 10px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }

      .score-fill {
        height: 100%;
        border-radius: 5px;
        transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .fill-good {
        background: linear-gradient(90deg, #00ff88, #22c55e);
      }

      .fill-average {
        background: linear-gradient(90deg, #f4c430, #fb923c);
      }

      .fill-caution {
        background: linear-gradient(90deg, #ff6b6b, #e63939);
      }

      .score-label {
        font-size: 0.7rem;
        color: var(--moon-silver);
        margin-top: 0.2rem;
      }

      .score-level {
        font-size: 0.72rem;
        font-weight: 700;
        padding: 0.15rem 0.55rem;
        border-radius: 50px;
        display: inline-block;
        margin-bottom: 0.75rem;
      }

      .level-good {
        background: rgba(0, 255, 136, 0.12);
        border: 1px solid rgba(0, 255, 136, 0.35);
        color: #00ff88;
      }

      .level-average {
        background: rgba(244, 196, 48, 0.12);
        border: 1px solid rgba(244, 196, 48, 0.35);
        color: #f4c430;
      }

      .level-caution {
        background: rgba(255, 107, 107, 0.12);
        border: 1px solid rgba(255, 107, 107, 0.35);
        color: #ff6b6b;
      }

      .interp {
        font-size: 0.85rem;
        color: var(--moon-silver);
        line-height: 1.65;
        margin-bottom: 0.9rem;
      }

      .remedy-box {
        background: rgba(167, 139, 250, 0.07);
        border: 1px solid rgba(167, 139, 250, 0.2);
        border-radius: 9px;
        padding: 0.7rem 0.9rem;
        font-size: 0.8rem;
        color: #c4b5fd;
        line-height: 1.55;
      }

      .remedy-box strong {
        color: #e2e8f0;
        display: block;
        margin-bottom: 0.2rem;
      }

      /* Scale legend */
      .legend-strip {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
        margin: 0 auto 2rem;
        max-width: 500px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.75rem;
        color: var(--moon-silver);
      }

      .legend-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }

      /* Loader */
      .rashi-loader {
        text-align: center;
        padding: 4rem 0;
      }

      .spin-ring {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(167, 139, 250, 0.2);
        border-top-color: #a78bfa;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Score display table */
      .score-table {
        width: 100%;
        border-collapse: collapse;
        margin: 1rem 0;
      }

      .score-table td {
        padding: 0.4rem 0.5rem;
        font-size: 0.8rem;
        color: var(--moon-silver);
      }

      .score-table td:first-child {
        font-weight: 600;
        color: var(--soft-white);
      }

      @media (max-width: 540px) {
        .rashi-hero h1 {
          font-size: 1.8rem;
        }

        .tab-btn {
          font-size: 0.8rem;
          padding: 0.55rem 0.6rem;
        }
      }
    </style>

</head>

  <body>
    <div class="cosmic-bg">
      <div class="stars"></div>
      <div class="stars2"></div>
      <div class="stars3"></div>
    </div>
    <div
      class="container"
      style="max-width: 1100px; margin: 0 auto; padding: 1rem"
    >
      <header class="site-header">
        <div class="logo">
          <span class="logo-icon">✦</span
          ><span class="logo-text">AstroPsycho</span>
        </div>
        <nav style="display: flex; gap: 0.75rem; align-items: center">
          <a
            href="results.html"
            class="btn btn-secondary"
            style="font-size: 0.85rem; padding: 0.4rem 1rem"
            >← Back</a
          >
        </nav>
      </header>

      <div class="rashi-hero">
        <div style="font-size: 3rem; margin-bottom: 0.6rem">🔮</div>
        <h1
          style="
            background: linear-gradient(135deg, #a78bfa, #818cf8, #64ffda);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
          "
        >
          राशिफल
        </h1>
        <div class="hin">Daily · Monthly · Yearly Horoscope</div>
        <p id="heroSubtitle">
          Personalised Vedic predictions for <strong>5 life aspects</strong> —
          Health, Education, Wealth, Career &amp; Family — computed from your
          birth chart and current planetary transits.
        </p>
      </div>

      <!-- Tab switcher -->
      <div class="tab-bar">
        <button
          class="tab-btn active"
          id="tabDaily"
          onclick="switchTab('daily')"
        >
          📅 Daily
        </button>
        <button class="tab-btn" id="tabMonthly" onclick="switchTab('monthly')">
          🗓️ Monthly
        </button>
        <button class="tab-btn" id="tabYearly" onclick="switchTab('yearly')">
          📆 Yearly
        </button>
      </div>

      <!-- Period label (updates with tab) -->
      <div class="period-label" id="periodLabel"></div>

      <!-- Score legend -->
      <div class="legend-strip">
        <div class="legend-item">
          <div class="legend-dot" style="background: #00ff88"></div>
          65–100 Good
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background: #f4c430"></div>
          35–65 Average
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background: #ff6b6b"></div>
          0–35 Caution
        </div>
      </div>

      <!-- Loading -->
      <div class="rashi-loader" id="loadingPanel">
        <div class="spin-ring"></div>
        <div style="color: #a78bfa">Calculating planetary transits…</div>
      </div>

      <!-- Results -->
      <div id="resultsPanel" style="display: none">
        <div class="aspect-grid" id="aspectGrid"></div>
      </div>
    </div>

    <script src="js/astrology-engine-v8.js"></script>
    <script src="js/rashifal-engine.js"></script>
    <script>
      const ASPECT_ORDER = [
        "health",
        "education",
        "wealth",
        "career",
        "family",
      ];
      let rashiData = null;
      let currentTab = "daily";

      document.addEventListener("DOMContentLoaded", () => {
        const stored = localStorage.getItem("astropsycho_assessment");
        if (!stored) {
          alert("Birth data not found. Please complete the assessment first.");
          window.location.href = "index.html";
          return;
        }
        const { birthDetails } = JSON.parse(stored);
        document.getElementById("heroSubtitle").innerHTML =
          `Personalised Vedic horoscope for <strong>${birthDetails.fullName || "you"}<\/strong> — computed from birth chart &amp; current planetary transits.`;

        setTimeout(() => {
          try {
            const eng = new VedicAstrologyEngine();
            const chart = eng.calculateBirthChart(birthDetails);
            const re = new RashifalEngine();
            rashiData = re.analyze(chart);
            document.getElementById("loadingPanel").style.display = "none";
            document.getElementById("resultsPanel").style.display = "block";
            switchTab("daily");
          } catch (e) {
            console.error(e);
            document.getElementById("loadingPanel").innerHTML =
              `<p style="color:#ff6b6b">Error: ${e.message}<\/p>`;
          }
        }, 800);
      });

      function switchTab(tab) {
        currentTab = tab;
        ["daily", "monthly", "yearly"].forEach((t) => {
          document
            .getElementById("tab" + t.charAt(0).toUpperCase() + t.slice(1))
            .classList.toggle("active", t === tab);
        });
        const labels = {
          daily: `📅 ${rashiData ? rashiData.meta.date : "Today"}`,
          monthly: `🗓️ ${rashiData ? rashiData.meta.month : "This Month"}`,
          yearly: `📆 ${rashiData ? rashiData.meta.year + " — Annual Forecast" : "This Year"}`,
        };
        document.getElementById("periodLabel").textContent = labels[tab];
        if (rashiData) renderAspects(rashiData[tab]);
      }

      function renderAspects(data) {
        const def = {
          health: {
            emoji: "🏥",
            label: "Health",
            color: "rgba(100,255,218,.18)",
          },
          education: {
            emoji: "🎓",
            label: "Education",
            color: "rgba(56,189,248,.18)",
          },
          wealth: {
            emoji: "💰",
            label: "Wealth",
            color: "rgba(244,196,48,.15)",
          },
          career: {
            emoji: "💼",
            label: "Career",
            color: "rgba(167,139,250,.18)",
          },
          family: {
            emoji: "👨‍👩‍👧",
            label: "Family",
            color: "rgba(251,146,60,.15)",
          },
        };

        const grid = document.getElementById("aspectGrid");
        grid.innerHTML = "";
        ASPECT_ORDER.forEach((key) => {
          const d = data[key];
          const info = def[key];
          const fillClass =
            d.level === "good"
              ? "fill-good"
              : d.level === "average"
                ? "fill-average"
                : "fill-caution";
          const levelClass = `level-${d.level}`;
          const levelText = RashifalEngine.scoreLabel(d.score);
          const scoreColor =
            d.level === "good"
              ? "#00ff88"
              : d.level === "average"
                ? "#f4c430"
                : "#ff6b6b";

          const card = document.createElement("div");
          card.className = "aspect-card";
          card.style.borderColor = `rgba(${d.level === "good" ? "0,255,136" : d.level === "average" ? "244,196,48" : "255,107,107"},.25)`;
          card.innerHTML = `
                    <div class="ac-header" style="background:${info.color}">
                        <span class="ac-emoji">${info.emoji}<\/span>
                        <div>
                            <div class="ac-title">${info.label}<\/div>
                            <span class="score-level ${levelClass}">${levelText}<\/span>
                        <\/div>
                    <\/div>
                    <div class="ac-body">
                        <div class="score-row">
                            <div class="score-num" style="color:${scoreColor}">${d.score}<\/div>
                            <div class="score-bar-wrap">
                                <div class="score-bar-bg">
                                    <div class="score-fill ${fillClass}" style="width:0%" id="bar-${key}"><\/div>
                                <\/div>
                                <div class="score-label">Score out of 100<\/div>
                            <\/div>
                        <\/div>
                        <p class="interp">${d.interpretation}<\/p>
                        <div class="remedy-box">
                            <strong>✨ Vedic Remedy<\/strong>
                            ${d.remedy}
                        <\/div>
                    <\/div>
                `;
          grid.appendChild(card);
          // Animate bar
          requestAnimationFrame(() => {
            setTimeout(() => {
              const bar = document.getElementById(`bar-${key}`);
              if (bar) bar.style.width = `${d.score}%`;
            }, 100);
          });
        });
      }
    </script>
    <script src="mobile-nav.js"></script>
    <script src="js/hindi-translate.js"></script>
  
    <!-- AI Ashish Floating Chatbot Widget -->
    <script src="astro_chatbot.js"></script>
  </body>
</html>
