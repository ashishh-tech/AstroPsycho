    <style>
        .muh-hero {
            text-align: center;
            padding: 3rem 1rem 2rem;
            background: radial-gradient(ellipse at top,
                    rgba(244, 196, 48, 0.06),
                    transparent 70%);
        }

        .muh-hero h1 {
            font-family: "Cinzel", serif;
            font-size: 2.4rem;
            color: var(--star-gold);
            margin-bottom: 0.5rem;
        }

        .activity-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.75rem;
            margin: 1.5rem 0;
        }

        .act-btn {
            padding: 0.9rem 0.5rem;
            border: 2px solid rgba(244, 196, 48, 0.2);
            border-radius: 12px;
            background: rgba(20, 20, 50, 0.7);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            color: var(--moon-silver);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .act-btn:hover {
            border-color: var(--star-gold);
            color: var(--star-gold);
            transform: translateY(-2px);
        }

        .act-btn.active {
            border-color: var(--star-gold);
            background: rgba(244, 196, 48, 0.1);
            color: var(--star-gold);
        }

        .act-btn .act-icon {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 0.35rem;
        }

        .search-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0a0a1f;
            border: none;
            padding: 0.9rem 2.5rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
            margin-top: 1rem;
            width: 100%;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(245, 158, 11, 0.6);
        }

        .search-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .results-panel {
            margin-top: 2rem;
            display: none;
        }

        .day-card {
            background: rgba(20, 20, 60, 0.9);
            border: 1px solid rgba(244, 196, 48, 0.2);
            border-radius: 14px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 1rem;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .day-card:hover {
            transform: translateY(-2px);
        }

        .day-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            border-radius: 14px 0 0 14px;
        }

        .day-card.excellent {
            border-color: rgba(100, 255, 218, 0.4);
        }

        .day-card.excellent::before {
            background: #64ffda;
        }

        .day-card.good {
            border-color: rgba(244, 196, 48, 0.4);
        }

        .day-card.good::before {
            background: #f4c430;
        }

        .day-card.acceptable {
            border-color: rgba(249, 115, 22, 0.4);
        }

        .day-card.acceptable::before {
            background: #f97316;
        }

        .day-card.avoid {
            border-color: rgba(255, 107, 157, 0.3);
        }

        .day-card.avoid::before {
            background: #ff6b9d;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .grade-badge {
            padding: 0.3rem 0.85rem;
            border-radius: 50px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .score-bar-outer {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 6px;
            height: 8px;
            width: 100%;
            margin: 0.4rem 0 1rem;
        }

        .score-bar-inner {
            height: 100%;
            border-radius: 6px;
            transition: width 0.6s ease;
        }

        .panchang-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 0.85rem;
            margin-bottom: 0.75rem;
        }

        .panch-item {
            font-size: 0.82rem;
            color: var(--moon-silver);
        }

        .panch-item strong {
            color: var(--soft-white);
        }

        .reason-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.6rem;
        }

        .chip {
            padding: 0.25rem 0.65rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .chip.good {
            background: rgba(100, 255, 218, 0.12);
            color: #64ffda;
            border: 1px solid rgba(100, 255, 218, 0.25);
        }

        .chip.bad {
            background: rgba(255, 107, 157, 0.12);
            color: #ff6b9d;
            border: 1px solid rgba(255, 107, 157, 0.25);
        }

        .today-panchang {
            background: linear-gradient(135deg,
                    rgba(244, 196, 48, 0.08),
                    rgba(100, 255, 218, 0.05));
            border: 1px solid rgba(244, 196, 48, 0.3);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .today-panchang h3 {
            font-family: "Cinzel", serif;
            color: var(--star-gold);
            margin-bottom: 1rem;
        }

        .panch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 0.75rem;
        }

        .panch-tile {
            background: rgba(10, 10, 31, 0.6);
            border: 1px solid rgba(100, 255, 218, 0.15);
            border-radius: 8px;
            padding: 0.85rem 1rem;
        }

        .panch-tile .p-label {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
        }

        .panch-tile .p-value {
            font-size: 0.92rem;
            color: var(--soft-white);
            font-weight: 600;
        }

        .panch-tile .p-sub {
            font-size: 0.75rem;
            color: var(--accent-cyan);
            margin-top: 0.15rem;
        }

        .summary-bar {
            background: rgba(100, 255, 218, 0.05);
            border: 1px solid rgba(100, 255, 218, 0.15);
            border-radius: 10px;
            padding: 0.85rem 1.25rem;
            margin-bottom: 1.25rem;
            font-size: 0.88rem;
            color: var(--moon-silver);
        }

        @media (max-width: 600px) {
            .activity-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* ── Mobile Overrides (≤540px) ── */
        @media (max-width: 540px) {
            .activity-grid {
                grid-template-columns: repeat(2, 1fr) !important;
            }

            /* Date range grid */
            div[style*="grid-template-columns:1fr 1fr"] {
                grid-template-columns: 1fr !important;
            }

            .day-header {
                flex-direction: column;
                gap: 0.75rem;
            }

            .day-header>div:last-child {
                width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
                text-align: left;
            }
        }

        /* Prevent CSS grid blowout on mobile */
        .varga-layout>div,
        .varsha-grid>div,
        .navamsa-grid>div,
        .charts-grid>div,
        .report-section,
        .dignity-grid>div,
        .irow>div,
        .table-responsive {
            min-width: 0 !important;
        }

        /* Force table text to stay on one line for better mobile scrolling */
        .planet-table th,
        .planet-table td,
        table th,
        table td {
            white-space: nowrap;
        }
    </style>

                    <input id="fromDate" type="date" style="

    <script src="js/muhurta-engine.js"></script>
    <script>
const eng = new MuhurtaEngine();
let selectedAct = null;
/* Set default dates */
(function() {
    const today = new Date();
    const next30 = new Date();
    next30.setDate(today.getDate() + 30);
    document.getElementById("fromDate")
        .value = today
        .toISOString()
        .split("T")[0];
    document.getElementById("toDate")
        .value = next30
        .toISOString()
        .split("T")[0];
})();
/* Render today's Panchang */
(function() {
    const p = eng.calcPanchang(new Date());
    const grid = document.getElementById("todayGrid");
    const GOOD_YOGA = eng.goodYogas.includes(p.yogaIdx);
    const BAD_YOGA = eng.badYogas.includes(p.yogaIdx);
    grid.innerHTML = [{
                l: "Vara (Weekday)",
                v: p.vara,
                s: p.varaPlanet.charAt(0)
                    .toUpperCase() +
                    p.varaPlanet.slice(1) +
                    " Day",
            },
            {
                l: "Tithi",
                v: p.tithiName,
                s: p.paksha + " Paksha"
            },
            {
                l: "Nakshatra",
                v: p.nakshatra,
                s: "Moon in " + p.moonSign
            },
            {
                l: "Yoga",
                v: p.yoga,
                s: GOOD_YOGA ?
                    "✓ Auspicious" : BAD_YOGA ?
                    "⚠ Inauspicious" : "Neutral",
            },
            {
                l: "Karana",
                v: p.karana,
                s: p.isVishti ? "⚠ Bhadra — avoid new starts" : "Clear",
            },
            {
                l: "Moon Sign",
                v: p.moonSign,
                s: "Chandra Rashi"
            },
        ]
        .map(
            (x) =>
            `<div class="panch-tile"><div class="p-label">${x.l}<\/div><div class="p-value">${x.v}<\/div><div class="p-sub">${x.s}<\/div><\/div>`,
        )
        .join("");
})();
document.querySelectorAll(".act-btn")
    .forEach((btn) => {
        btn.addEventListener("click", () => {
            document
                .querySelectorAll(".act-btn")
                .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            selectedAct = btn.dataset.act;
        });
    });

function findMuhurtas() {
    if (!selectedAct) {
        alert("Please choose an activity first.");
        return;
    }
    const from = new Date(document.getElementById("fromDate")
        .value);
    const to = new Date(document.getElementById("toDate")
        .value);
    if (isNaN(from) || isNaN(to)) {
        alert("Please select valid dates.");
        return;
    }
    const days = Math.min(60, Math.round((to - from) / 86400000) + 1);
    if (days < 1) {
        alert("End date must be after start date.");
        return;
    }
    const btn = document.getElementById("searchBtn");
    btn.disabled = true;
    btn.textContent = "📅 Scanning dates...";
    setTimeout(() => {
        const results = eng.findBestWindows(from, days, selectedAct);
        const top = results.slice(0, 10);
        /* Show top 10 */
        const excellent = top.filter((r) => r.grade === "Excellent")
            .length;
        const good = top.filter((r) => r.grade === "Good")
            .length;
        document.getElementById("summaryBar")
            .innerHTML =
            `Scanned <strong>${days} days<\/strong>. Found <strong style="color:#64ffda">${excellent} Excellent<\/strong> and <strong style="color:#f4c430">${good} Good<\/strong> muhurtas. Showing top 10 ↓`;
        const actLabels = {
            marriage: "Marriage",
            business: "New Business",
            travel: "Travel",
            investment: "Investment",
            education: "Education Start",
            medical: "Surgery / Medical",
            house: "Griha Pravesh",
            worship: "Puja / Worship",
        };
        const cards = top
            .map((r, i) => {
                const d = r.date;
                const dateStr = d.toLocaleDateString("en-IN", {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    year: "numeric",
                });
                const chips = r.details
                    .slice(0, 4)
                    .map(
                        (det) =>
                        `<span class="chip ${det.pos ? "good" : "bad"}">${det.t.replace(/[✓⚠]\s/, "")}<\/span>`,
                    )
                    .join("");
                const gradeClass = r.grade.toLowerCase();
                const barColor = r.gradeColor;
                const gradeStyle = `background:${r.gradeColor}20;color:${r.gradeColor};border:1px solid ${r.gradeColor}40`;
                return `<div class="day-card ${gradeClass}">         <div class="day-header">           <div>             <div style="font-family:'Cinzel',serif;font-size:1.1rem;color:${i === 0 ? "var(--star-gold)" : "var(--soft-white)"}">${i === 0 ? "⭐ " : i + 1 + ". "}${dateStr}<\/div>             <div style="display:flex;flex-wrap:wrap;gap:.5rem .85rem;margin-top:.5rem">               <span class="panch-item"><strong>Tithi:<\/strong> ${r.panchang.tithiName}<\/span>               <span class="panch-item"><strong>Nakshatra:<\/strong> ${r.panchang.nakshatra}<\/span>               <span class="panch-item"><strong>Yoga:<\/strong> ${r.panchang.yoga}<\/span>               <span class="panch-item"><strong>Karana:<\/strong> ${r.panchang.karana}${r.panchang.isVishti ? " ⚠" : ""}<\/span>             <\/div>           <\/div>           <div style="text-align:right">             <span class="grade-badge" style="${gradeStyle}">${r.grade}<\/span>             <div style="color:${r.gradeColor};font-size:1.3rem;font-weight:800;margin-top:.3rem">${r.score}<span style="font-size:.75rem;font-weight:400">/100<\/span><\/div>           <\/div>         <\/div>         <div class="score-bar-outer"><div class="score-bar-inner" style="width:${r.score}%;background:${barColor}"><\/div><\/div>         <div class="reason-chips">${chips}<\/div>       <\/div>`;
            })
            .join("");
        document.getElementById("resultCards")
            .innerHTML = cards;
        document.getElementById("resultsPanel")
            .style.display = "block";
        document
            .getElementById("resultsPanel")
            .scrollIntoView({
                behavior: "smooth"
            });
        btn.disabled = false;
        btn.textContent = "📅 Find Auspicious Dates";
    }, 600);
}
</script>
