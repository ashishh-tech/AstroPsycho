<!doctype html>
<html lang="en">
  <head>
    <meta
      name="description"
      content="AstroPsycho: The premier Vedic astrology engine combining precise planetary calculations with deep psychological insights."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover"
    />
    <title>Education Analysis — AstroPsycho</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="mobile-nav.css" />
    <meta name="theme-color" content="#0a0a1f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@400;600;700&family=Dancing+Script:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .edu-hero {
        text-align: center;
        padding: 3rem 1rem 2rem;
        background: radial-gradient(
          ellipse at top,
          rgba(100, 200, 255, 0.08),
          transparent 70%
        );
      }

      .edu-hero h1 {
        font-family: "Cinzel", serif;
        font-size: 2.3rem;
        color: var(--accent-cyan);
        margin-bottom: 0.5rem;
      }

      .edu-hero p {
        color: var(--moon-silver);
        max-width: 700px;
        margin: 0 auto;
        line-height: 1.8;
      }

      .edu-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
        margin-bottom: 4rem;
      }

      @media (min-width: 900px) {
        .edu-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .edu-card {
        background: rgba(20, 20, 50, 0.7);
        border: 1px solid rgba(100, 200, 255, 0.2);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }

      .edu-card-header {
        background: linear-gradient(
          90deg,
          rgba(100, 200, 255, 0.12),
          transparent
        );
        padding: 1.2rem 1.5rem;
        border-bottom: 1px solid rgba(100, 200, 255, 0.2);
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .edu-card-icon {
        font-size: 1.6rem;
      }

      .edu-card-title {
        font-family: "Cinzel", serif;
        font-size: 1.15rem;
        color: var(--accent-cyan);
      }

      .edu-card-body {
        padding: 1.25rem 1.5rem;
      }

      .field-item {
        background: rgba(100, 200, 255, 0.06);
        border: 1px solid rgba(100, 200, 255, 0.15);
        border-radius: 10px;
        padding: 1rem;
        margin-bottom: 0.75rem;
      }

      .field-item:last-child {
        margin-bottom: 0;
      }

      .field-name {
        font-size: 1rem;
        font-weight: 600;
        color: var(--soft-white);
        margin-bottom: 0.4rem;
      }

      .field-reason {
        font-size: 0.85rem;
        color: var(--moon-silver);
        line-height: 1.6;
      }

      .score-bar-wrap {
        margin: 1rem 0 0.5rem;
      }

      .score-label {
        font-size: 0.85rem;
        color: var(--moon-silver);
        margin-bottom: 0.5rem;
      }

      .score-bar {
        height: 12px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }

      .score-fill {
        height: 100%;
        border-radius: 6px;
        transition: width 1s ease;
      }

      .score-fill.high {
        background: linear-gradient(90deg, #00ff88, #00cc66);
      }

      .score-fill.mid {
        background: linear-gradient(90deg, #f4c430, #e6a817);
      }

      .score-fill.low {
        background: linear-gradient(90deg, #ff6b6b, #e63939);
      }

      .score-number {
        font-size: 2rem;
        font-weight: 700;
        margin: 0.5rem 0;
      }

      .breakdown-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
        margin-top: 0.75rem;
      }

      .breakdown-table th {
        text-align: left;
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--accent-cyan);
        font-weight: 600;
      }

      .breakdown-table td {
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        color: var(--moon-silver);
        vertical-align: top;
      }

      .breakdown-table td:nth-child(2) {
        color: var(--star-gold);
        font-weight: 600;
        white-space: nowrap;
      }

      .risk-badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 50px;
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
      }

      .risk-high {
        background: rgba(255, 107, 107, 0.15);
        border: 1px solid rgba(255, 107, 107, 0.4);
        color: #ff6b6b;
      }

      .risk-moderate {
        background: rgba(244, 196, 48, 0.12);
        border: 1px solid rgba(244, 196, 48, 0.35);
        color: #f4c430;
      }

      .risk-low {
        background: rgba(0, 255, 136, 0.1);
        border: 1px solid rgba(0, 255, 136, 0.3);
        color: #00ff88;
      }

      .list-item {
        display: flex;
        gap: 0.6rem;
        padding: 0.6rem 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .list-item:last-child {
        border-bottom: none;
      }

      .list-dot {
        flex-shrink: 0;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent-cyan);
        margin-top: 0.45rem;
      }

      .list-text {
        font-size: 0.88rem;
        color: var(--moon-silver);
        line-height: 1.6;
      }

      .timeline-item {
        display: flex;
        gap: 1rem;
        padding: 0.75rem 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .timeline-item:last-child {
        border-bottom: none;
      }

      .timeline-age {
        min-width: 90px;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--accent-cyan);
        padding-top: 0.15rem;
      }

      .timeline-content .timeline-phase {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--soft-white);
        margin-bottom: 0.25rem;
      }

      .timeline-content .timeline-note {
        font-size: 0.82rem;
        color: var(--moon-silver);
        line-height: 1.5;
      }

      .style-box {
        background: rgba(100, 200, 255, 0.06);
        border-radius: 10px;
        padding: 1rem;
        margin-bottom: 1rem;
      }

      .style-name {
        font-size: 1rem;
        font-weight: 700;
        color: var(--accent-cyan);
        margin-bottom: 0.4rem;
      }

      .style-tip {
        font-size: 0.88rem;
        color: var(--moon-silver);
        line-height: 1.6;
      }

      .section-label {
        font-family: "Cinzel", serif;
        font-size: 0.9rem;
        color: var(--accent-cyan);
        margin: 0.75rem 0 0.3rem;
        letter-spacing: 0.5px;
      }

      .prospect-box {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--soft-white);
        padding: 0.75rem 1rem;
        background: rgba(100, 200, 255, 0.08);
        border-radius: 8px;
        margin-bottom: 0.75rem;
      }

      .full-width-card {
        grid-column: 1/-1;
      }

      /* Hindi toggle */
      .hi-text {
        display: none !important;
      }

      .en-text {
        display: inline !important;
      }

      body.hindi-mode .hi-text {
        display: inline !important;
      }

      body.hindi-mode .en-text {
        display: none !important;
      }

      @media (max-width: 540px) {
        .edu-hero h1 {
          font-size: 1.7rem;
        }

        .edu-card-body {
          padding: 1rem;
        }
      }

      /* Prevent CSS grid blowout on mobile */
      .varga-layout > div,
      .varsha-grid > div,
      .navamsa-grid > div,
      .charts-grid > div,
      .report-section,
      .dignity-grid > div,
      .irow > div,
      .table-responsive {
        min-width: 0 !important;
      }

      /* Force table text to stay on one line for better mobile scrolling */
      .planet-table th,
      .planet-table td,
      table th,
      table td {
        white-space: nowrap;
      }
    </style>
  </head>

  <body>
    <div class="cosmic-bg">
      <div class="stars"></div>
      <div class="stars2"></div>
      <div class="stars3"></div>
    </div>
    <div
      class="container"
      style="max-width: 1200px; margin: 0 auto; padding: 1rem"
    >
      <header class="site-header">
        <div class="logo">
          <span class="logo-icon">✦</span
          ><span class="logo-text">AstroPsycho</span>
        </div>
        <nav style="display: flex; gap: 0.75rem; align-items: center">
          <a
            href="results.html"
            class="btn btn-secondary"
            style="font-size: 0.85rem; padding: 0.4rem 1rem"
            >← Back</a
          >
        </nav>
      </header>
      <div class="edu-hero">
        <div style="font-size: 3rem; margin-bottom: 0.75rem">🄔</div>
        <h1>Education Analysis</h1>
        <p>
          A comprehensive Vedic astrological analysis of your academic journey —
          recommended fields, intelligence style, gap year risks, higher
          education prospects, and detailed timelines.
        </p>
      </div>
      <div id="loadingPanel" style="text-align: center; padding: 4rem 0">
        <div
          class="loader"
          style="
            width: 40px;
            height: 40px;
            border: 3px solid rgba(100, 200, 255, 0.2);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
          "
        ></div>
        <div style="color: var(--accent-cyan)">
          Analyzing Mercury, Jupiter, 4th, 5th & 9th House...
        </div>
      </div>
      <div id="resultsPanel" style="display: none">
        <div class="edu-grid" id="eduGrid"></div>
      </div>
    </div>
    <style>
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Prevent CSS grid blowout on mobile */
      .varga-layout > div,
      .varsha-grid > div,
      .navamsa-grid > div,
      .charts-grid > div,
      .report-section,
      .dignity-grid > div,
      .irow > div,
      .table-responsive {
        min-width: 0 !important;
      }

      /* Force table text to stay on one line for better mobile scrolling */
      .planet-table th,
      .planet-table td,
      table th,
      table td {
        white-space: nowrap;
      }
    </style>
    <script src="js/astrology-engine-v8.js"></script>
    <script src="js/education-engine.js"></script>
    <script>
document.addEventListener("DOMContentLoaded", () => {
    const stored = localStorage.getItem("astropsycho_assessment");
    if (!stored) {
        alert("Birth data not found. Please complete the assessment first.");
        window.location.href = "index.html";
        return;
    }
    const {
        birthDetails
    } = JSON.parse(stored);
    setTimeout(() => {
        try {
            const baseEng = new VedicAstrologyEngine();
            const chart = baseEng.calculateBirthChart(birthDetails);
            const eduEng = new EducationEngine();
            const result = eduEng.analyze(chart);
            renderEducation(result);
            document.getElementById("loadingPanel")
                .style.display = "none";
            document.getElementById("resultsPanel")
                .style.display = "block";
        } catch (err) {
            console.error(err);
            alert("Error: " + err.message);
        }
    }, 900);
});

function scoreColor(s) {
    return s >= 7 ? "high" : s >= 4 ? "mid" : "low";
}

function riskClass(r) {
    return r.toLowerCase()
        .includes("high") ?
        "risk-high" :
        r.toLowerCase()
        .includes("low") ?
        "risk-low" :
        "risk-moderate";
}

function renderEducation(r) {
    const grid = document.getElementById("eduGrid");
    /* Card 1: Academic Score */
    const sc = r.score,
        scColor = scoreColor(sc);
    const breakdownRows = r.breakdown
        .map(
            (b) =>
            `<tr><td>${b.label}<\/td><td>${b.impact}<\/td><td>${b.note}<\/td><\/tr>`,
        )
        .join("");
    grid.innerHTML += `     <div class="edu-card">         <div class="edu-card-header"><span class="edu-card-icon">📈<\/span><span class="edu-card-title">Academic Strength Score<\/span><\/div>         <div class="edu-card-body">             <div style="text-align:center">                 <div class="score-number" style="color:${scColor === "high" ? "#00ff88" : scColor === "mid" ? "#f4c430" : "#ff6b6b"}">${sc}/10<\/div>                 <div style="font-size:.85rem;color:var(--moon-silver);margin-bottom:1rem">${sc >= 7 ? "Strong academic foundations" : "⚛ Moderate — effort-dependent results"}<\/div>             <\/div>             <div class="score-bar-wrap"><div class="score-bar"><div class="score-fill ${scColor}" style="width:${sc * 10}%"><\/div><\/div><\/div>             <div style="overflow-x:auto;width:100%;border-radius:8px"><table class="breakdown-table"><thead><tr><th>Factor<\/th><th>Impact<\/th><th>Interpretation<\/th><\/tr><\/thead><tbody>${breakdownRows}<\/tbody><\/table><\/div>         <\/div>     <\/div>`;
    /* Card 2: Learning Style */
    grid.innerHTML += `     <div class="edu-card">         <div class="edu-card-header"><span class="edu-card-icon">🺡<\/span><span class="edu-card-title">Your Learning Style<\/span><\/div>         <div class="edu-card-body">             <div class="style-box">                 <div class="style-name">🄻 ${r.learningStyle.style}<\/div>                 <div class="style-tip">${r.learningStyle.tip}<\/div>             <\/div>         <\/div>     <\/div>`;
    /* Card 3: Recommended Fields (full width) */
    const fieldsHtml = r.fields
        .map(
            (f) =>
            `<div class="field-item"><div class="field-name">${f.icon} ${f.field}<\/div><div class="field-reason">${f.reason}<\/div><\/div>`,
        )
        .join("");
    grid.innerHTML += `     <div class="edu-card full-width-card">         <div class="edu-card-header"><span class="edu-card-icon">📜<\/span><span class="edu-card-title">Recommended Fields of Study<\/span><\/div>         <div class="edu-card-body">${fieldsHtml}<\/div>     <\/div>`;
    /* Card 4: Gap Year Risk */
    const gapR = r.gapYear;
    grid.innerHTML += `     <div class="edu-card">         <div class="edu-card-header"><span class="edu-card-icon">⏳<\/span><span class="edu-card-title">Gap Year Risk<\/span><\/div>         <div class="edu-card-body">             <span class="risk-badge ${riskClass(gapR.risk)}">${gapR.risk} Risk<\/span>             <div class="section-label">Reasons<\/div>             ${gapR.reasons.map((r) => `<div class="list-item"><div class="list-dot"><\/div><div class="list-text">${r}<\/div><\/div>`).join("")}             <div class="section-label" style="margin-top:1rem">Planetary Remedies<\/div>             ${gapR.remedies.map((r) => `<div class="list-item"><div class="list-dot" style="background:#f4c430"><\/div><div class="list-text">${r}<\/div><\/div>`).join("")}         <\/div>     <\/div>`;
    /* Card 5: Higher Education */
    const he = r.higherEd;
    grid.innerHTML += `     <div class="edu-card">         <div class="edu-card-header"><span class="edu-card-icon">🄔<\/span><span class="edu-card-title">Higher Education Prospects<\/span><\/div>         <div class="edu-card-body">             <div class="prospect-box">${he.prospect}<\/div>             ${he.details.map((d) => `<div class="list-item"><div class="list-dot"><\/div><div class="list-text">${d}<\/div><\/div>`).join("")}         <\/div>     <\/div>`;
    /* Card 6: Foreign Education */
    const fe = r.foreignEd;
    grid.innerHTML += `     <div class="edu-card">         <div class="edu-card-header"><span class="edu-card-icon">🌌<\/span><span class="edu-card-title">Foreign Education<\/span><\/div>         <div class="edu-card-body">             <div class="prospect-box">${fe.likelihood}<\/div>             ${fe.factors.map((f) => `<div class="list-item"><div class="list-dot" style="background:#a78bfa"><\/div><div class="list-text">${f}<\/div><\/div>`).join("")}         <\/div>     <\/div>`;
    /* Card 7: Competitive Exams */
    const ce = r.competitive;
    grid.innerHTML += `     <div class="edu-card">         <div class="edu-card-header"><span class="edu-card-icon">🅅<\/span><span class="edu-card-title">Competitive Exams<\/span><\/div>         <div class="edu-card-body">             <div class="prospect-box">${ce.aptitude}<\/div>             ${ce.tips.map((t) => `<div class="list-item"><div class="list-dot" style="background:#f4c430"><\/div><div class="list-text">${t}<\/div><\/div>`).join("")}         <\/div>     <\/div>`;
    /* Card 8: Research */
    const re = r.research;
    grid.innerHTML += `     <div class="edu-card">         <div class="edu-card-header"><span class="edu-card-icon">🔼<\/span><span class="edu-card-title">Research & Special Talents<\/span><\/div>         <div class="edu-card-body">             <div class="prospect-box">${re.aptitude}<\/div>             ${re.areas.map((a) => `<div class="list-item"><div class="list-dot" style="background:#a78bfa"><\/div><div class="list-text">${a}<\/div><\/div>`).join("")}         <\/div>     <\/div>`;
    /* Card 9: Timeline (full width) */
    const tlHtml = r.timeline
        .map(
            (t) =>
            `     <div class="timeline-item">         <div class="timeline-age">${t.age}<\/div>         <div class="timeline-content">             <div class="timeline-phase">${t.phase}<\/div>             <div class="timeline-note">${t.note}<\/div>         <\/div>     <\/div>`,
        )
        .join("");
    grid.innerHTML += `     <div class="edu-card full-width-card">         <div class="edu-card-header"><span class="edu-card-icon">📂<\/span><span class="edu-card-title">Education Timeline<\/span><\/div>         <div class="edu-card-body">${tlHtml}<\/div>     <\/div>`;
}
</script>
    <script src="mobile-nav.js"></script>
    <script src="js/hindi-translate.js"></script>
  </body>
</html>
