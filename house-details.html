<!doctype html>
<html lang="en">
  <head>
    <meta
      name="description"
      content="AstroPsycho: The premier Vedic astrology engine combining precise planetary calculations with deep psychological insights."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0, viewport-fit=cover"
    />
    <title>Detailed 12-House Analysis — AstroPsycho</title>
    <link rel="stylesheet" href="styles.css" />
    <meta name="theme-color" content="#0a0a1f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="stylesheet" href="mobile-nav.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@400;600;700&family=Dancing+Script:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .med-hero {
        text-align: center;
        padding: 3rem 1rem 2rem;
        background: radial-gradient(
          ellipse at top,
          rgba(244, 196, 48, 0.08),
          transparent 70%
        );
      }

      .med-hero h1 {
        font-family: "Cinzel", serif;
        font-size: 2.4rem;
        color: var(--star-gold);
        margin-bottom: 0.5rem;
      }

      .results-panel {
        margin-top: 2rem;
        display: none;
      }

      .house-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 2rem;
        margin-bottom: 4rem;
      }

      .house-card {
        background: rgba(20, 20, 50, 0.7);
        border: 1px solid rgba(100, 255, 218, 0.2);
        border-radius: 12px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }

      .house-header {
        background: linear-gradient(
          90deg,
          rgba(244, 196, 48, 0.15),
          transparent
        );
        padding: 1.5rem;
        border-bottom: 1px solid rgba(244, 196, 48, 0.3);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .house-title {
        font-family: "Cinzel", serif;
        font-size: 1.5rem;
        color: var(--star-gold);
        margin: 0;
      }

      .house-sign {
        font-size: 0.9rem;
        color: var(--accent-cyan);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
      }

      .house-body {
        padding: 1.5rem;
      }

      .signification-text {
        font-style: italic;
        color: var(--moon-silver);
        font-size: 0.95rem;
        margin-bottom: 1.5rem;
        line-height: 1.6;
        border-left: 3px solid rgba(255, 255, 255, 0.2);
        padding-left: 1rem;
      }

      .detail-row {
        display: flex;
        margin-bottom: 0.75rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .detail-row:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
      }

      .detail-label {
        min-width: 140px;
        font-weight: 600;
        color: var(--soft-white);
        font-size: 0.9rem;
      }

      .detail-value {
        color: var(--moon-silver);
        font-size: 0.95rem;
        flex-grow: 1;
        line-height: 1.5;
      }

      .planet-tag {
        display: inline-block;
        background: rgba(100, 255, 218, 0.1);
        border: 1px solid rgba(100, 255, 218, 0.3);
        color: var(--accent-cyan);
        padding: 0.2rem 0.6rem;
        border-radius: 50px;
        font-size: 0.8rem;
        margin-right: 0.4rem;
        margin-bottom: 0.4rem;
        text-transform: capitalize;
      }

      .synthesis-box {
        margin-top: 1.5rem;
        padding: 1rem;
        background: rgba(124, 58, 237, 0.1);
        border-radius: 8px;
        border-left: 4px solid #a78bfa;
      }

      .synthesis-label {
        font-family: "Cinzel", serif;
        color: #a78bfa;
        font-weight: 700;
        margin-bottom: 0.3rem;
        display: block;
      }

      @media (min-width: 900px) {
        .house-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      /* ── Mobile Overrides (≤540px) ── */
      @media (max-width: 540px) {
        .med-hero h1 {
          font-size: 1.8rem;
        }

        .detail-row {
          flex-direction: column;
          gap: 0.3rem;
        }

        .detail-label {
          min-width: unset;
          margin-bottom: 0.2rem;
          color: var(--accent-cyan);
        }

        .house-header {
          padding: 1rem 1.25rem;
        }

        .house-body {
          padding: 1.25rem;
        }
      }

      /* ── Hindi / English toggle for pre-rendered bilingual content ── */
      .hi-text {
        display: none !important;
      }

      .en-text {
        display: inline !important;
      }

      body.hindi-mode .hi-text {
        display: inline !important;
      }

      body.hindi-mode .en-text {
        display: none !important;
      }

      /* Prevent CSS grid blowout on mobile */
      .varga-layout > div,
      .varsha-grid > div,
      .navamsa-grid > div,
      .charts-grid > div,
      .report-section,
      .dignity-grid > div,
      .irow > div,
      .table-responsive {
        min-width: 0 !important;
      }

      /* Force table text to stay on one line for better mobile scrolling */
      .planet-table th,
      .planet-table td,
      table th,
      table td {
        white-space: nowrap;
      }

      .synthesis-box ul {
        margin: 0.5rem 0 0 0 !important;
        padding-left: 1.2rem !important;
      }

      .synthesis-box li {
        margin-bottom: 0.85rem;
        line-height: 1.6;
      }

      .synthesis-box li:last-child {
        margin-bottom: 0;
      }

      .synthesis-box strong {
        color: #d8b4fe;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
    </style>
  </head>

  <body>
    <div class="cosmic-bg">
      <div class="stars"></div>
      <div class="stars2"></div>
      <div class="stars3"></div>
    </div>
    <div
      class="container"
      style="max-width: 1200px; margin: 0 auto; padding: 1rem"
    >
      <header class="site-header">
        <div class="logo">
          <span class="logo-icon">✦</span>
          <span class="logo-text">AstroPsycho</span>
        </div>
        <nav style="display: flex; gap: 1rem; align-items: center">
          <a
            href="results.html"
            class="btn btn-secondary"
            style="font-size: 0.85rem; padding: 0.4rem 1rem"
            >← Back</a
          >
        </nav>
      </header>
      <div class="med-hero">
        <div style="font-size: 3rem; margin-bottom: 0.75rem">🏠</div>
        <h1>Comprehensive 12-House Analysis</h1>
        <p
          style="
            color: var(--moon-silver);
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.8;
          "
        >
          A deep dive into every area of your life. Every house is analyzed
          based on its ruling planet, dispositor strength, planetary occupants,
          and aspects hitting the house.
        </p>
      </div>
      <div class="results-panel" id="resultsPanel">
        <div class="house-grid" id="houseGrid"></div>
      </div>
      <div id="loadingPanel" style="text-align: center; padding: 4rem 0">
        <div
          class="loader"
          style="
            width: 40px;
            height: 40px;
            border: 3px solid rgba(244, 196, 48, 0.2);
            border-top-color: var(--star-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
          "
        ></div>
        <div style="color: var(--star-gold)">
          Calculating house lords, aspects, and dispositors...
        </div>
      </div>
    </div>
    <style>
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Prevent CSS grid blowout on mobile */
      .varga-layout > div,
      .varsha-grid > div,
      .navamsa-grid > div,
      .charts-grid > div,
      .report-section,
      .dignity-grid > div,
      .irow > div,
      .table-responsive {
        min-width: 0 !important;
      }

      /* Force table text to stay on one line for better mobile scrolling */
      .planet-table th,
      .planet-table td,
      table th,
      table td {
        white-space: nowrap;
      }
    </style>
    <script src="js/astrology-engine-v8.js"></script>
    <script src="js/house-engine.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var stored = localStorage.getItem('astropsycho_assessment');
        if (!stored) {
          alert('Birth data not found. Please complete the assessment first.');
          window.location.href = 'index.html';
          return;
        }
        var assessmentData = JSON.parse(stored);
        var birthDetails = assessmentData.birthDetails;
        setTimeout(function() {
          try {
            var baseEng = new VedicAstrologyEngine();
            var chart = baseEng.calculateBirthChart(birthDetails);
            var houseEng = new HouseAnalysisEngine();
            var analysis = houseEng.generate12HouseAnalysis(chart);
            renderHouseGrid(analysis);
            document.getElementById('loadingPanel').style.display = 'none';
            document.getElementById('resultsPanel').style.display = 'block';
          } catch(err) {
            console.error(err);
            alert('Error generating house analysis: ' + err.message);
          }
        }, 1000);
      });

      function renderHouseGrid(analysis) {
        var grid = document.getElementById('houseGrid');
        var html = '';
        for (var i = 0; i < analysis.length; i++) {
          var h = analysis[i];

          var occupantTags = '';
          if (h.occupants.length > 0) {
            for (var j = 0; j < h.occupants.length; j++) {
              occupantTags += '<span class="planet-tag" style="border-color:#ff6b9d;color:#ff6b9d;background:rgba(255,107,157,0.1)">' + h.occupants[j] + '</span>';
            }
          } else {
            occupantTags = '<span style="color:rgba(255,255,255,0.3);font-style:italic">Empty House</span>';
          }

          var aspectTags = '';
          if (h.aspectingPlanets.length > 0) {
            for (var k = 0; k < h.aspectingPlanets.length; k++) {
              aspectTags += '<span class="planet-tag">' + h.aspectingPlanets[k] + '</span>';
            }
          } else {
            aspectTags = '<span style="color:rgba(255,255,255,0.3);font-style:italic">No Aspects</span>';
          }

          var lordPlacementTextEn = h.lordPlacementHouse ? 'Placed in House ' + h.lordPlacementHouse + ' (' + h.lordStatus + ')' : 'Placement Unknown';
          var lordPlacementTextHi = h.lordPlacementHouse ? 'भाव ' + h.lordPlacementHouse + ' में स्थित (' + h.lordStatus + ')' : 'स्थिति अज्ञात';

          html += '<div class="house-card">';
          html += '<div class="house-header"><h2 class="house-title">' + h.houseTitle + '</h2><span class="house-sign">' + h.sign + '</span></div>';
          html += '<div class="house-body">';
          html += '<div class="signification-text"><span class="en-text">Signifies: ' + h.significations + '</span><span class="hi-text" style="display:none">संकेत: ' + h.significations + '</span></div>';
          html += '<div class="detail-row"><div class="detail-label"><span class="en-text">House Lord:</span><span class="hi-text" style="display:none">भावेश:</span></div><div class="detail-value"><strong style="color:var(--soft-white)">' + h.lord + '</strong></div></div>';
          html += '<div class="detail-row"><div class="detail-label"><span class="en-text">Lord Placement:</span><span class="hi-text" style="display:none">स्वामी स्थिति:</span></div>';
          html += '<div class="detail-value"><span style="display:block;margin-bottom:0.2rem;color:var(--star-gold)"><span class="en-text">' + lordPlacementTextEn + '</span><span class="hi-text" style="display:none">' + lordPlacementTextHi + '</span></span>';
          html += '<span style="font-size:0.85rem"><span class="en-text">' + h.lordEffect.en + '</span><span class="hi-text" style="display:none">' + h.lordEffect.hi + '</span></span></div></div>';
          html += '<div class="detail-row"><div class="detail-label">Occupants (Sits Here):</div><div class="detail-value">' + occupantTags + '</div></div>';
          html += '<div class="detail-row"><div class="detail-label">Aspects (Looks Here):</div><div class="detail-value">' + aspectTags + '</div></div>';
          html += '<div class="synthesis-box"><span class="synthesis-label"><span class="en-text">Overall House Synthesis:</span><span class="hi-text" style="display:none">संपूर्ण भाव संश्लेषण:</span></span>';
          html += '<span style="color:var(--soft-white);font-size:0.95rem;line-height:1.5"><span class="en-text">' + h.synthesis.en + '</span><span class="hi-text" style="display:none">' + h.synthesis.hi + '</span></span></div>';
          html += '</div></div>';
        }
        grid.innerHTML = html;
      }
    </script>
    <script src="mobile-nav.js"></script>
    <script src="js/hindi-translate.js"></script>
  </body>
</html>
