    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@400;600;700&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        .wealth-hero {
            text-align: center;
            padding: 3rem 1rem 2rem;
            background: radial-gradient(ellipse at top,
                    rgba(244, 196, 48, 0.09),
                    transparent 70%);
        }

        .wealth-hero h1 {
            font-family: "Cinzel", serif;
            font-size: 2.3rem;
            color: var(--star-gold);
            margin-bottom: 0.5rem;
        }

        .wealth-hero p {
            color: var(--moon-silver);
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.8;
        }

        .w-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        @media (min-width: 900px) {
            .w-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .w-card {
            background: rgba(20, 20, 50, 0.7);
            border: 1px solid rgba(244, 196, 48, 0.2);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .w-card-header {
            background: linear-gradient(90deg,
                    rgba(244, 196, 48, 0.1),
                    transparent);
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid rgba(244, 196, 48, 0.2);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .w-card-icon {
            font-size: 1.6rem;
        }

        .w-card-title {
            font-family: "Cinzel", serif;
            font-size: 1.15rem;
            color: var(--star-gold);
        }

        .w-card-body {
            padding: 1.25rem 1.5rem;
        }

        .score-bar-wrap {
            margin: 1rem 0 0.5rem;
        }

        .score-bar {
            height: 12px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .score-fill-gold {
            height: 100%;
            border-radius: 6px;
            background: linear-gradient(90deg, #f4c430, #ffaa00);
            transition: width 1s ease;
        }

        .score-fill-warn {
            height: 100%;
            border-radius: 6px;
            background: linear-gradient(90deg, #ff6b6b, #e63939);
            transition: width 1s ease;
        }

        .score-number {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--star-gold);
            text-align: center;
            margin: 0.5rem 0;
        }

        .breakdown-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            margin-top: 0.75rem;
        }

        .breakdown-table th {
            text-align: left;
            padding: 0.5rem 0.6rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--star-gold);
            font-weight: 600;
        }

        .breakdown-table td {
            padding: 0.45rem 0.6rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--moon-silver);
            vertical-align: top;
        }

        .breakdown-table td:nth-child(2) {
            color: var(--star-gold);
            font-weight: 600;
            white-space: nowrap;
        }

        .source-item {
            background: rgba(244, 196, 48, 0.06);
            border: 1px solid rgba(244, 196, 48, 0.15);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }

        .source-item:last-child {
            margin-bottom: 0;
        }

        .source-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--soft-white);
            margin-bottom: 0.35rem;
        }

        .source-detail {
            font-size: 0.83rem;
            color: var(--moon-silver);
            line-height: 1.6;
        }

        .prospect-box {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--soft-white);
            padding: 0.75rem 1rem;
            background: rgba(244, 196, 48, 0.08);
            border-radius: 8px;
            margin-bottom: 0.75rem;
            border-left: 3px solid var(--star-gold);
        }

        .list-item {
            display: flex;
            gap: 0.6rem;
            padding: 0.55rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-dot {
            flex-shrink: 0;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--star-gold);
            margin-top: 0.45rem;
        }

        .list-dot-red {
            background: #ff6b6b;
        }

        .list-dot-green {
            background: #00ff88;
        }

        .list-text {
            font-size: 0.86rem;
            color: var(--moon-silver);
            line-height: 1.6;
        }

        .risk-row {
            background: rgba(255, 107, 107, 0.06);
            border: 1px solid rgba(255, 107, 107, 0.2);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.6rem;
        }

        .risk-row:last-child {
            margin-bottom: 0;
        }

        .risk-factor {
            font-weight: 600;
            color: var(--soft-white);
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
        }

        .risk-severity {
            display: inline-block;
            font-size: 0.75rem;
            padding: 0.15rem 0.5rem;
            border-radius: 50px;
            margin-bottom: 0.4rem;
        }

        .risk-high {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid rgba(255, 107, 107, 0.4);
            color: #ff6b6b;
        }

        .risk-moderate {
            background: rgba(244, 196, 48, 0.15);
            border: 1px solid rgba(244, 196, 48, 0.35);
            color: #f4c430;
        }

        .risk-low {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }

        .risk-detail {
            font-size: 0.82rem;
            color: var(--moon-silver);
            line-height: 1.55;
        }

        .remedy-item {
            background: rgba(167, 139, 250, 0.07);
            border: 1px solid rgba(167, 139, 250, 0.2);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }

        .remedy-planet {
            font-weight: 700;
            color: #a78bfa;
            font-size: 0.95rem;
            margin-bottom: 0.4rem;
        }

        .remedy-row {
            font-size: 0.82rem;
            color: var(--moon-silver);
            line-height: 1.55;
            margin: 0.25rem 0;
        }

        .remedy-label {
            color: var(--soft-white);
            font-weight: 600;
        }

        .timeline-item {
            display: flex;
            gap: 1rem;
            padding: 0.7rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .timeline-item:last-child {
            border-bottom: none;
        }

        .timeline-phase-box {
            min-width: 115px;
        }

        .timeline-status {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--star-gold);
        }

        .timeline-phase-name {
            font-size: 0.8rem;
            color: var(--accent-cyan);
            font-weight: 600;
            margin-top: 0.1rem;
        }

        .timeline-note {
            font-size: 0.82rem;
            color: var(--moon-silver);
            line-height: 1.55;
        }

        .section-label {
            font-family: "Cinzel", serif;
            font-size: 0.85rem;
            color: var(--star-gold);
            margin: 0.75rem 0 0.4rem;
            letter-spacing: 0.5px;
        }

        .full-width-card {
            grid-column: 1/-1;
        }

        .luxury-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .luxury-box {
            flex: 1;
            min-width: 160px;
            background: rgba(244, 196, 48, 0.07);
            border: 1px solid rgba(244, 196, 48, 0.2);
            border-radius: 10px;
            padding: 0.9rem;
            text-align: center;
        }

        .luxury-val {
            font-size: 2rem;
            margin-bottom: 0.3rem;
        }

        .luxury-label {
            font-size: 0.8rem;
            color: var(--moon-silver);
        }

        .luxury-score {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--star-gold);
        }

        /* Hindi toggle */
        .hi-text {
            display: none !important;
        }

        .en-text {
            display: inline !important;
        }

        body.hindi-mode .hi-text {
            display: inline !important;
        }

        body.hindi-mode .en-text {
            display: none !important;
        }

        @media (max-width: 540px) {
            .wealth-hero h1 {
                font-size: 1.7rem;
            }

            .w-card-body {
                padding: 1rem;
            }

            .luxury-row {
                flex-direction: column;
            }
        }

        /* Prevent CSS grid blowout on mobile */
        .varga-layout>div,
        .varsha-grid>div,
        .navamsa-grid>div,
        .charts-grid>div,
        .report-section,
        .dignity-grid>div,
        .irow>div,
        .table-responsive {
            min-width: 0 !important;
        }

        /* Force table text to stay on one line for better mobile scrolling */
        .planet-table th,
        .planet-table td,
        table th,
        table td {
            white-space: nowrap;
        }
    </style>

<body>
    <div class="cosmic-bg">
        <div class="stars"></div>

    <div class="container" style="max-width: 1200px; margin: 0 auto; padding: 1rem">
        <header class="site-header">
            <div class="logo">
                <span class="logo-icon">✦</span><span class="logo-text">AstroPsycho</span>
            </div>
            <nav style="display: flex; gap: 0.75rem; align-items: center">
                <a href="results.html" class="btn btn-secondary" style="font-size: 0.85rem; padding: 0.4rem 1rem">← Back</a>
            </nav>
        </header>
        <div class="wealth-hero">
            <div style="font-size: 3rem; margin-bottom: 0.75rem">&#127963;</div>
            <h1>Wealth Analysis</h1>
            <p>
                A comprehensive Vedic astrological analysis of your financial life —
                sources of income, property, vehicles, luxury potential, risks of
                financial loss, inheritance prospects, and actionable remedies.
            </p>
        </div>
        <div id="loadingPanel" style="text-align: center; padding: 4rem 0">
            <div class="loader" style="
            width: 40px;
            height: 40px;
            border: 3px solid rgba(244, 196, 48, 0.2);
            border-top-color: var(--star-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
          "></div>
            <div style="color: var(--star-gold)">
                Analyzing Jupiter, Venus, 2nd, 4th, 8th & 11th Houses...
            </div>
        </div>
        <div id="resultsPanel" style="display: none">
            <div class="w-grid" id="wGrid"></div>
        </div>

    <style>
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Prevent CSS grid blowout on mobile */
        .varga-layout>div,
        .varsha-grid>div,
        .navamsa-grid>div,
        .charts-grid>div,
        .report-section,
        .dignity-grid>div,
        .irow>div,

        /* Force table text to stay on one line for better mobile scrolling */
        .planet-table th,
        .planet-table td,
        table th,

        }

    <script>
document.addEventListener("DOMContentLoaded", () => {
    const stored = localStorage.getItem("astropsycho_assessment");
    if (!stored) {
        alert("Birth data not found. Please complete the assessment first.");
        window.location.href = "index.html";
        return;
    }
    const {
        birthDetails
    } = JSON.parse(stored);
    setTimeout(() => {
        try {
            const baseEng = new VedicAstrologyEngine();
            const chart = baseEng.calculateBirthChart(birthDetails);
            const wEng = new WealthEngine();
            const result = wEng.analyze(chart);
            renderWealth(result);
            document.getElementById("loadingPanel")
                .style.display = "none";
            document.getElementById("resultsPanel")
                .style.display = "block";
        } catch (err) {
            console.error(err);
            alert("Error: " + err.message);
        }
    }, 900);
});

function renderWealth(r) {
    const grid = document.getElementById("wGrid");
    /* Card 1: Wealth Score */
    const ws = r.wealthScore;
    const scColor =
        ws.score >= 7 ? "#00ff88" : ws.score >= 4 ? "#f4c430" : "#ff6b6b";
    const breakdownRows = ws.breakdown
        .map(
            (b) =>
            `<tr><td>${b.label}<\/td><td>${b.impact}<\/td><td>${b.note}<\/td><\/tr>`,
        )
        .join("");
    grid.innerHTML +=
        `     <div class="w-card">         <div class="w-card-header"><span class="w-card-icon">&#128142;<\/span><span class="w-card-title">Overall Wealth Score<\/span><\/div>         <div class="w-card-body">             <div class="score-number" style="color:${scColor}">${ws.score}/10<\/div>             <div class="score-bar-wrap"><div class="score-bar"><div class="score-fill-gold" style="width:${ws.score * 10}%;background:linear-gradient(90deg,${ws.score >= 7 ? "#00ff88,#00cc66" : ws.score >= 4 ? "#f4c430,#ffaa00" : "#ff6b6b,#e63939"})"><\/div><\/div><\/div>             <div style="overflow-x:auto;width:100%;border-radius:8px"><table class="breakdown-table"><thead><tr><th>Factor<\/th><th>Impact<\/th><th>Interpretation<\/th><\/tr><\/thead><tbody>${breakdownRows}<\/tbody><\/table><\/div>         <\/div>     <\/div>`;
    /* Card 2: Wealth Sources (full width) */
    const srcHtml = r.wealthSources
        .map(
            (s) =>
            `<div class="source-item"><div class="source-name">${s.icon} ${s.source}<\/div><div class="source-detail">${s.detail}<\/div><\/div>`,
        )
        .join("");
    grid.innerHTML +=
        `     <div class="w-card">         <div class="w-card-header"><span class="w-card-icon">&#128184;<\/span><span class="w-card-title">Primary Wealth Sources<\/span><\/div>         <div class="w-card-body">${srcHtml}<\/div>     <\/div>`;
    /* Card 3: Property */
    const p = r.propertyAnalysis;
    const propDetails = p.details
        .map(
            (d) =>
            `<div class="list-item"><div class="list-dot"><\/div><div class="list-text">${d}<\/div><\/div>`,
        )
        .join("");
    grid.innerHTML +=
        `     <div class="w-card">         <div class="w-card-header"><span class="w-card-icon">&#127960;<\/span><span class="w-card-title">Property & Real Estate<\/span><\/div>         <div class="w-card-body">             <div class="prospect-box">${p.propertyProspect}<\/div>             <div class="score-number" style="font-size:1.5rem;color:var(--star-gold);margin:.3rem 0">${p.pScore}/10 — Property Score<\/div>             ${propDetails}             <div class="section-label" style="margin-top:1rem">✐ Best Timing<\/div>             <div class="list-text" style="padding:.5rem 0">${p.propertyTiming}<\/div>         <\/div>     <\/div>`;
    /* Card 4: Vehicles & Luxury */
    const vl = r.vehicleLuxury;
    const vlDetails = vl.details
        .map(
            (d) =>
            `<div class="list-item"><div class="list-dot"><\/div><div class="list-text">${d}<\/div><\/div>`,
        )
        .join("");
    grid.innerHTML +=
        `     <div class="w-card">         <div class="w-card-header"><span class="w-card-icon">&#127790;<\/span><span class="w-card-title">Vehicles & Luxury<\/span><\/div>         <div class="w-card-body">             <div class="luxury-row">                 <div class="luxury-box"><div class="luxury-val">&#128663;<\/div><div class="luxury-label">Vehicle Level<\/div><\/div>                 <div class="luxury-box"><div class="luxury-score">${vl.vScore}/10<\/div><div class="luxury-label">Luxury Score<\/div><\/div>                 <div class="luxury-box"><div class="luxury-val">&#128715;<\/div><div class="luxury-label">Comfort Level<\/div><\/div>             <\/div>             <div class="prospect-box">${vl.vehicleProspect}<\/div>             <div class="prospect-box" style="border-left-color:#a78bfa;color:#a78bfa">${vl.luxuryLevel}<\/div>             ${vlDetails}         <\/div>     <\/div>`;
    /* Card 5: Loss Risks (full width) */
    const lr = r.lossRisks;
    const riskHtml = lr.risks
        .map(
            (ri) =>
            `<div class="risk-row"><div class="risk-factor">${ri.factor}<\/div><span class="risk-severity ${ri.severity === "High" ? "risk-high" : ri.severity === "Moderate" ? "risk-moderate" : "risk-low"}">${ri.severity} Risk<\/span><div class="risk-detail">${ri.detail}<\/div><\/div>`,
        )
        .join("");
    const cautionHtml = lr.cautionPeriods
        .map(
            (c) =>
            `<div class="list-item"><div class="list-dot list-dot-red"><\/div><div class="list-text">${c}<\/div><\/div>`,
        )
        .join("");
    const protHtml = lr.protections
        .map(
            (p) =>
            `<div class="list-item"><div class="list-dot list-dot-green"><\/div><div class="list-text">${p}<\/div><\/div>`,
        )
        .join("");
    grid.innerHTML +=
        `     <div class="w-card full-width-card">         <div class="w-card-header"><span class="w-card-icon">&#128201;<\/span><span class="w-card-title">Financial Loss Risks & Caution Periods<\/span><\/div>         <div class="w-card-body">             <div class="section-label">Risk Factors<\/div>             ${riskHtml}             <div class="section-label" style="margin-top:1rem">✐ Periods of Caution<\/div>             ${cautionHtml}             <div class="section-label" style="margin-top:1rem">⚡ Protective Measures<\/div>             ${protHtml}         <\/div>     <\/div>`;
    /* Card 6: Inheritance */
    const inh = r.inheritance;
    grid.innerHTML +=
        `     <div class="w-card">         <div class="w-card-header"><span class="w-card-icon">&#127873;<\/span><span class="w-card-title">Inheritance & Windfall<\/span><\/div>         <div class="w-card-body">             <div class="prospect-box">${inh.prospect}<\/div>             ${inh.indicators.map((i) => `<div class="list-item"><div class="list-dot"><\/div><div class="list-text">${i}<\/div><\/div>`).join("")}         <\/div>     <\/div>`;
    /* Card 7: Wealth Timeline */
    const tlHtml = r.wealthTimeline
        .map(
            (t) =>
            `     <div class="timeline-item">         <div class="timeline-phase-box">             <div class="timeline-phase-name">${t.phase.split(":")[0]}<\/div>             <div class="timeline-status">${t.status}<\/div>         <\/div>         <div class="timeline-note">${t.note}<\/div>     <\/div>`,
        )
        .join("");
    grid.innerHTML +=
        `     <div class="w-card">         <div class="w-card-header"><span class="w-card-icon">📂<\/span><span class="w-card-title">Wealth Timeline by Age<\/span><\/div>         <div class="w-card-body">${tlHtml}<\/div>     <\/div>`;
    /* Card 8: Remedies (full width) */
    const remHtml = r.remedies
        .map(
            (rem) =>
            `     <div class="remedy-item">         <div class="remedy-planet">&#129668; ${rem.planet}<\/div>         <div class="remedy-row"><span class="remedy-label">Mantra: <\/span>${rem.mantra}<\/div>         <div class="remedy-row"><span class="remedy-label">Ritual: <\/span>${rem.ritual}<\/div>         <div class="remedy-row"><span class="remedy-label">Gemstone/Crystal: <\/span>${rem.gemstone}<\/div>     <\/div>`,
        )
        .join("");
    grid.innerHTML +=
        `     <div class="w-card full-width-card">         <div class="w-card-header"><span class="w-card-icon">&#128220;<\/span><span class="w-card-title">Wealth Remedies & Planetary Corrections<\/span><\/div>         <div class="w-card-body">${remHtml}<\/div>     <\/div>`;
}
</script>
    <script src="mobile-nav.js"></script>
    <script src="js/hindi-translate.js"></script>

    <script src="astro_chatbot.js"></script>
