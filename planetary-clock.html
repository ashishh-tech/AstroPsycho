    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #04041a;
            --card: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --cyan: #64ffda;
            --gold: #f5c518;
            --purple: #a855f7;
            --pink: #f472b6;
            --white: #f0f4ff;
            --silver: #94a3b8;
            --dim: #475569;
            --font-display: "Cinzel", serif;
            --font-body: "Inter", sans-serif;
            --radius: 16px;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        body {
            background: var(--bg);
            color: var(--white);
            font-family: var(--font-body);
            line-height: 1.6;
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        /* BG */
        #bgCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(80px);
            opacity: 0.1;
            animation: orbFloat linear infinite;
        }

        .orb1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #7c3aed, transparent);
            top: -15%;
            left: -10%;
            animation-duration: 30s;
        }

        .orb2 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #0e7490, transparent);
            bottom: -10%;
            right: -8%;
            animation-duration: 40s;
            animation-direction: reverse;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            50% {
                transform: translate(30px, -40px) rotate(180deg);
            }

            100% {
                transform: translate(0, 0) rotate(360deg);
            }
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1.25rem;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .page-header {
            text-align: center;
            padding: 3rem 0 2rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--silver);
            font-size: 0.85rem;
            text-decoration: none;
            margin-bottom: 1.5rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--cyan);
        }

        .page-icon {
            font-size: 3rem;
            margin-bottom: 0.75rem;
            filter: drop-shadow(0 0 20px rgba(100, 255, 218, 0.5));
            animation: spin 20s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .page-title {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 700;
            background: linear-gradient(135deg,
                    var(--cyan),
                    var(--white),
                    var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            color: var(--silver);
            font-size: 1rem;
        }

        /* Live indicator */
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(100, 255, 218, 0.07);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 100px;
            padding: 0.35rem 1rem;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--cyan);
            letter-spacing: 0.08em;
            margin-bottom: 1.5rem;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.2;
            }
        }

        /* Clock */
        .clock-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 1rem 1.5rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 2rem;
        }

        .clock-time {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold), var(--white));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .clock-date {
            color: var(--silver);
            font-size: 0.85rem;
        }

        .clock-next {
            color: var(--dim);
            font-size: 0.8rem;
        }

        .next-red {
            color: #f87171;
        }

        /* Solar system visual */
        .solar-system {
            position: relative;
            width: 100%;
            padding-bottom: 40%;
            max-width: 600px;
            margin: 0 auto 2rem;
            min-height: 220px;
        }

        #solarCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* Planet grid */
        .planets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .planet-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            display: flex;
            align-items: flex-start;
            gap: 0.85rem;
            transition: all 0.4s;
            cursor: default;
            animation: cardIn 0.4s ease both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .planet-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .planet-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
            border: 1px solid;
        }

        .planet-info {
            flex: 1;
            min-width: 0;
        }

        .planet-name {
            font-family: var(--font-display);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }

        .planet-rashi {
            font-size: 1rem;
            font-weight: 600;
            color: var(--white);
            margin-bottom: 0.1rem;
        }

        .planet-deg {
            font-size: 0.78rem;
            color: var(--silver);
        }

        .planet-nak {
            font-size: 0.75rem;
            color: var(--dim);
            margin-top: 0.2rem;
        }

        .planet-symbol {
            font-size: 1.1rem;
            margin-left: auto;
            color: var(--dim);
        }

        /* Zodiac wheel segment counter */
        .zodiac-strip {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 2px;
            padding: 1rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 2rem;
            text-align: center;
            overflow-x: auto;
        }

        .rashi-cell {
            padding: 0.5rem 0.2rem;
            border-radius: 8px;
            transition: all 0.3s;
            position: relative;
        }

        .rashi-cell.occupied {
            background: rgba(100, 255, 218, 0.08);
            border: 1px solid rgba(100, 255, 218, 0.2);
        }

        .rashi-name {
            font-size: 0.62rem;
            color: var(--silver);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }

        .rashi-planets {
            font-size: 0.9rem;
            line-height: 1;
            margin-top: 0.3rem;
            min-height: 1.2rem;
        }

        /* Nav */
        .page-nav {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .nav-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 1.1rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 100px;
            color: var(--silver);
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.3s;
        }

        .nav-pill:hover {
            color: var(--white);
            border-color: rgba(100, 255, 218, 0.3);
            background: rgba(100, 255, 218, 0.05);
        }
    </style>

    <div class="orb orb1"></div>

    <div class="container">
        <div class="page-header">
            <a href="index.html" class="back-link">← Back to Home</a>
            <div class="page-icon">�</div>
            <h1 class="page-title">Live Planetary Clock</h1>
            <p class="page-subtitle">
                Real-time Sidereal Positions of all 9 Vedic Grahas
            </p>
        </div>
        <div style="text-align: center">
            <div class="live-badge">
                <span class="live-dot"></span> LIVE — Updates every 60 seconds
            </div>
        </div>
        <div class="clock-bar">
            <div>
                <div class="clock-time" id="clockTime">--:--:--</div>
                <div class="clock-date" id="clockDate">Loading...</div>
            </div>
            <div>
                <div class="clock-next" id="nextUpdate">
                    Next update in <span id="countdown" class="next-red">60</span>s
                </div>
            </div>
        </div>
        <!-- Zodiac strip -->
        <div class="zodiac-strip" id="zodiacStrip"><!-- filled by JS --></div>
        <!-- Planet cards -->
        <div class="planets-grid" id="planetsGrid"><!-- filled by JS --></div>
        <div class="page-nav">
            <a href="panchang.html" class="nav-pill">📂📅 Daily Panchang</a>
            <a href="dashboard.html" class="nav-pill">🅡 My Dashboard</a>
            <a href="transit-tracker.html" class="nav-pill">🌌 Transit Tracker</a>
        </div>

    <script src="js/planetary-clock-engine.js"></script>
    <script>
const clockEngine = new PlanetaryClockEngine();
let countdownSecs = 60;
const RASHIS_SHORT = [
    "Ari",
    "Tau",
    "Gem",
    "Can",
    "Leo",
    "Vir",
    "Lib",
    "Sco",
    "Sag",
    "Cap",
    "Aqu",
    "Pis",
];
const RASHIS_FULL = [
    "Aries",
    "Taurus",
    "Gemini",
    "Cancer",
    "Leo",
    "Virgo",
    "Libra",
    "Scorpio",
    "Sagittarius",
    "Capricorn",
    "Aquarius",
    "Pisces",
];

function pad(n) {
    return String(n)
        .padStart(2, "0");
}
/* Live clock */
function updateClock() {
    const now = new Date();
    document.getElementById("clockTime")
        .textContent =
        `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    document.getElementById("clockDate")
        .textContent =
        now.toLocaleDateString("en-IN", {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric",
        });
}
setInterval(updateClock, 1000);
updateClock();

function renderPlanets() {
    const data = clockEngine.calculate(new Date());
    /* Zodiac strip — which planets are in which sign */
    const bySign = Array.from({
        length: 12
    }, () => []);
    data.forEach((p) =>
        bySign[p.rashiIndex].push(p.symbol || p.emoji.charAt(0)),
    );
    const strip = document.getElementById("zodiacStrip");
    strip.innerHTML = RASHIS_SHORT.map(
            (r, i) =>
            `                 <div class="rashi-cell ${bySign[i].length ? "occupied" : ""}">                     <div class="rashi-name">${r}<\/div>                     <div class="rashi-planets">${bySign[i].join("")}<\/div>                 <\/div>             `,
        )
        .join("");
    /* Planet cards */
    const CARD_COLORS = {
        sun: "rgba(245,197,24,0.12)",
        moon: "rgba(192,200,224,0.12)",
        mercury: "rgba(100,255,218,0.1)",
        venus: "rgba(244,114,182,0.1)",
        mars: "rgba(248,113,113,0.1)",
        jupiter: "rgba(254,215,170,0.1)",
        saturn: "rgba(148,163,184,0.1)",
        rahu: "rgba(168,85,247,0.12)",
        ketu: "rgba(129,140,248,0.1)",
    };
    const grid = document.getElementById("planetsGrid");
    grid.innerHTML = data
        .map(
            (p, i) =>
            `                 <div class="planet-card" style="animation-delay:${i * 0.06}s;border-color:${p.color}22">                     <div class="planet-icon" style="background:${CARD_COLORS[p.id]};border-color:${p.color}33;color:${p.color}">                         ${p.emoji}                     <\/div>                     <div class="planet-info">                         <div class="planet-name" style="color:${p.color}">${p.name}<\/div>                         <div class="planet-rashi">${p.rashi}<\/div>                         <div class="planet-deg">${p.displayDeg} ┬╖ ${p.longitude.toFixed(2)}┬░<\/div>                         <div class="planet-nak">⭐ ${p.nakshatra}<\/div>                     <\/div>                     <div class="planet-symbol">${p.symbol}<\/div>                 <\/div>             `,
        )
        .join("");
}
/* Countdown & auto-refresh */
setInterval(() => {
    countdownSecs--;
    if (countdownSecs <= 0) {
        countdownSecs = 60;
        renderPlanets();
    }
    document.getElementById("countdown")
        .textContent = countdownSecs;
}, 1000);
/* Initial render */
renderPlanets();
</script>
