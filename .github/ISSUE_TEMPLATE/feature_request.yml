name: '🚀 Feature Request'
description: 'Suggest a new cosmic feature for AstroPsycho'
labels: ['enhancement', 'cosmic-expansion']
body:
  - type: textarea
    id: feature-description
    attributes:
      label: 'Vision'
      description: 'Describe the feature and how it enhances the AstroPsycho experience.'
      placeholder: 'e.g. Add a 3D Zodiac View...'
    validations:
      required: true
  - type: textarea
    id: implementation-ideas
    attributes:
      label: 'Architectural Thoughts'
      description: 'How should this be built? (Engines involved, logic, etc.)'
  - type: checkboxes
    id: high-tech
    attributes:
      label: 'High-Tech Check'
      options:
        - label: 'This feature is innovative and "High-Tech".'
          required: true
