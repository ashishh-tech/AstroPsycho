name: '🐛 Bug Report'
description: 'Report a cosmic misalignment in AstroPsycho'
labels: ['bug', 'astral-static']
body:
  - type: textarea
    id: bug-description
    attributes:
      label: 'The Glitch'
      description: 'What is happening and what did you expect?'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 'Steps to Reproduce'
      description: 'How can we see this glitch?'
      placeholder: |
        1. Go to Chart page
        2. Enter birth details...
  - type: input
    id: browser-info
    attributes:
      label: 'Astral Observation Port'
      description: 'Which browser/OS are you using?'
    validations:
      required: true
